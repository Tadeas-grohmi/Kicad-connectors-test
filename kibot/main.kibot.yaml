kibot:
  version: 1

outputs:

  # STEP model
  - name: 'Mechanicky_STEP'
    comment: '3D model desky v STEP formátu'
    type: step
    dir: 'Dokumentace/3D'
    options:
      include_tracks: false

  # Realistic PCB render - TOP
  - name: 'Realisticky_Render_PNG_top'
    comment: 'Render desky s průhledným pozadím'
    type: pcbdraw
    dir: 'Dokumentace/Render'
    options:
      format: png
      style: oshpark-afterdark
      ortho: true
      show_components: "all"
      dpi: 1000

  # Realistic PCB render - BOTTOM
  - name: 'Realisticky_Render_PNG_bottom'
    comment: 'Render desky s průhledným pozadím'
    type: pcbdraw
    dir: 'Dokumentace/Render'
    options:
      format: png
      bottom: true
      style: oshpark-afterdark
      show_components: "all"
      dpi: 1000

  # KiCad 3D render
  - name: 'Realisticky_3D_Render_PNG_top'
    comment: '3D render desky'
    type: render_3d
    dir: 'Dokumentace/Render'
    options:
      view: top
      width: 1920
      height: 1080
      ray_tracing: false

  # Schematic PDF
  - name: 'Schema_PDF'
    comment: 'Kompletní schéma zapojení v PDF'
    type: pdf_sch_print
    dir: 'Dokumentace/PDF'

  # PCB PDF
  - name: 'Deska_PDF'
    comment: 'Výrobní výkresy a vrstvy desky'
    type: pcb_print
    dir: 'Dokumentace/PDF'
    options:
      format: PDF
      pages:
        - layers:
            - layer: F.Cu
            - layer: F.SilkS
            - layer: B.Cu