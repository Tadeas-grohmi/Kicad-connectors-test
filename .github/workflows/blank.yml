name: KiBot

on:
  push:
    branches:
      - dev
      - main

    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - 'kibot/**'
      - '.github/workflows/kibot.yml'

  pull_request:
    branches:
      - dev
      - main

jobs:
  kibot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select KiBot configuration
        id: kibot_config
        shell: bash
        run: |
          if [[ "${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}" == "main" ]]; then
            echo "config=kibot/main.kibot.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "config=kibot/dev.kibot.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Run KiBot
        uses: INTI-CMNB/KiBot@v2_k6
        with:
          config: ${{ steps.kibot_config.outputs.config }}
          dir: output

      - name: Upload KiBot output
        uses: actions/upload-artifact@v4
        with:
          name: kibot-${{ github.ref_name }}
          path: output
